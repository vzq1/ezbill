<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EZBill</title>
  <meta name="description" content="Split a restaurant bill with friends. Each person's share of the service charge is based on what they ordered.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="application-name" content="EZBill">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EZBill">
  <script>
    try {
      if (localStorage.getItem("bill-split-theme") === "dark") {
        document.documentElement.dataset.mode = "dark";
        document.querySelector('meta[name="theme-color"]').content = "#0E0E0E";
        document.querySelector('meta[name="color-scheme"]').content = "dark";
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <span class="wordmark">EZBill</span>
      <div class="top-actions">
        <button type="button" class="icon-btn" id="theme-btn" aria-label="Switch to dark mode"></button>
        <button type="button" class="text-btn" id="new-bill">New</button>
      </div>
    </header>

    <section class="summary">
      <label class="label" for="receipt-total">Receipt total</label>
      <div class="amount-input">
        <span>₱</span>
        <input id="receipt-total" class="num" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </div>
      <div class="figures">
        <span>Food <b class="num" id="food-total">₱0.00</b></span>
        <span>Service <b class="num" id="service-total">—</b></span>
        <span class="num" id="rate"></span>
      </div>
      <p class="hint" id="summary-hint"></p>
      <div class="actions">
        <button type="button" class="btn btn-solid" id="share">Share split</button>
        <button type="button" class="btn btn-outline" id="gcash-btn">GCash QR</button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2>People</h2>
        <span id="people-count"></span>
      </div>
      <ul class="list" id="people"></ul>
    </section>

    <section>
      <div class="section-head">
        <h2>Items</h2>
        <span id="items-count"></span>
      </div>
      <ul class="list" id="items"></ul>
      <p class="hint" id="items-note"></p>
    </section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-bar">
      <button type="button" class="text-btn muted" id="sheet-cancel">Cancel</button>
      <strong id="sheet-title"></strong>
      <button type="button" class="text-btn" id="sheet-done">Done</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
