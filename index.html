<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bill Split</title>
  <meta name="description" content="Split a restaurant bill with friends. Each person's share of the service charge is based on what they ordered.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#EDF1F7">
  <meta name="application-name" content="Bill Split">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bill Split">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wallpaper" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
  <div class="navbar" id="navbar" aria-hidden="true"><div>Bill Split</div></div>

  <div class="toast glass" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    <div><strong id="toast-title"></strong><span class="toast-sub" id="toast-sub"></span></div>
  </div>

  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow" id="today"></p>
        <h1>Bill Split</h1>
      </div>
    </header>

    <div class="card glass hero">
      <div class="hero-top">
        <svg class="donut" id="donut" viewBox="0 0 140 140" aria-hidden="true"></svg>
        <div class="stats">
          <div>
            <div class="stat-label" id="total-label">Bill total</div>
            <div class="stat-big num" id="grand-total">₱0.00</div>
          </div>
          <div class="stat-row">
            <div>
              <div class="stat-label"><span class="dot" style="background:var(--accent)"></span>Food</div>
              <div class="stat-val num" id="items-total">₱0.00</div>
            </div>
            <div>
              <div class="stat-label"><span class="dot" style="background:var(--mint)"></span>Service</div>
              <div class="stat-val num" id="extra-total">—</div>
            </div>
          </div>
        </div>
      </div>
      <label class="well receipt">
        <span class="receipt-label">Total on receipt</span>
        <span class="receipt-peso">₱</span>
        <input id="receipt-total" class="receipt-input num" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off">
      </label>
      <p class="hero-note" id="hero-note"></p>
      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="share">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 7.5L12 3l4.5 4.5"/><path d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v7A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/></svg>
          Share Split
        </button>
        <button type="button" class="btn btn-quiet glass" id="new-bill">New Bill</button>
      </div>
    </div>

    <div class="quick-row">
      <button type="button" class="glass pill" id="gcash-btn">
        <span class="pill-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="14" y="3.5" width="6.5" height="6.5" rx="1.5"/><rect x="3.5" y="14" width="6.5" height="6.5" rx="1.5"/><path d="M14 14h2.5v2.5H14zM18 18h2.5v2.5H18zM14 20.5h.01M20.5 14h.01"/></svg></span>
        <span class="pill-label">GCash QR</span>
        <span class="pill-sub">Scan to pay</span>
        <svg class="chev" width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="section-head">
      <h3>People</h3>
      <span class="section-sub" id="people-count"></span>
    </div>
    <ul class="card glass list" id="people"></ul>
    <p class="footnote">Tap a person to see their items, rename or remove them.</p>

    <div class="section-head">
      <h3>Items</h3>
      <span class="section-sub" id="items-count"></span>
    </div>
    <ul class="card glass list" id="items"></ul>
    <p class="footnote" id="items-note">Enter menu prices as printed on the receipt.</p>

    <p class="signoff"><span>Bill Split</span>Made for Bon’s meals with friends</p>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-bar">
      <button type="button" class="link left" id="sheet-cancel">Cancel</button>
      <strong id="sheet-title"></strong>
      <button type="button" class="link right" id="sheet-done">Done</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
